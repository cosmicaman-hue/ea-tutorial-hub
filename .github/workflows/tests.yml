name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 matches runtime.txt (Render deployment). Local dev runs 3.14
      # without psycopg2-binary (SQLite-only); 3.11 has wheels for every pin.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1

      - name: Run tests
        run: pytest tests/ -q
