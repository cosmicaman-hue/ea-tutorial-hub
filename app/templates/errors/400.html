{% extends "base.html" %}

{% block content %}
<div class="error-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; padding: 40px 16px; text-align: center;">
    <h1 style="font-size: clamp(48px, 15vw, 72px); font-weight: bold; color: #dc3545; margin: 0;">400</h1>
    <h2 style="color: #495057; margin: 10px 0; font-size: clamp(1.1rem, 4vw, 1.5rem);">Bad Request</h2>
    <p style="color: #6c757d; font-size: clamp(14px, 3.5vw, 18px); margin: 20px 0; max-width: 400px;">
        The request was invalid or malformed.
    </p>
    <p style="color: #999; font-size: 14px; margin: 10px 0;">
        Please check your input and try again.
    </p>
    
    <div style="margin-top: 30px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
        <a href="javascript:history.back()" class="btn btn-secondary" style="background-color: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; min-height:44px; line-height:24px;">
            Go Back
        </a>
        <a href="{{ url_for('points.offline_scoreboard') }}" class="btn btn-primary" style="background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; min-height:44px; line-height:24px;">
            Go to Scoreboard
        </a>
    </div>
</div>
{% endblock %}
